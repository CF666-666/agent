server {
    listen 5177;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS：配合变量形式 proxy_pass 实现动态解析，
    # backend 容器重建（IP 变化）后无需重启前端即可自动拿到新 IP。
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # API 反向代理到后端容器（原样转发 /api/ragent/...）
    # 必须放在所有静态资源 location 之前，避免正则 location 抢走 /api/ 路径
    location /api/ {
        # 变量形式 proxy_pass：强制走 resolver 动态解析 backend 域名，
        # 避免 backend 容器重建后 IP 变化导致 502（静态写法只在启动时解析一次并缓存 IP）。
        set $backend_upstream http://backend:9090;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式输出：关闭缓冲，延长读取超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（仅作用于前端 dist 产物；用 ^~ + 否定预查排除 /api/ 路径）
    # 关键修复：原全正则 ~* \.(jpg|png|...) 会抢先匹配 /api/ragent/files/.../*.jpg，
    # 把请求抢到 try_files 找不到报 404，必须把 /api/ 排除。
    # 缓存策略：不设 immutable，避免新版发布后用户长期拿旧 bundle；
    # 浏览器使用协商缓存（If-None-Match ETag），受 Hot Module / CDN 影响更小。
    location ^~ /assets/ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header ETag $uri;
        try_files $uri =404;
    }

    location ~* ^/(?!api/).+\.(js|css|ico|woff2?)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
