server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://127.0.0.1:5432/ragent?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000

milvus:
  uri: http://localhost:19530

rag:
  vector:
    type: milvus  # 可选 milvus / pg

  default:
    collection-name: rag_default_store
    dimension: 4096
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  intent-resolve:
    timeout-millis: 2000

  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2
      image-semantic:
        timeout-millis: 3000

  rerank:
    timeout-millis: 3000

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    # Optional provider: set BAILIAN_API_KEY and enable one of its candidates
    # below when a DashScope model is preferred for a specific deployment.
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
        multimodal: /api/v1/services/aigc/multimodal-generation/generation
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
        rerank: /v1/rerank
        multimodal: /v1/chat/completions

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3-32b
    deep-thinking-model: qwen3-32b
    candidates:
      - id: qwen3-32b
        provider: siliconflow
        model: Qwen/Qwen3-32B
        supports-thinking: true
        priority: 1
      - id: qwen3-max-bailian
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 10
        enabled: false
      - id: deepseek-v3.2
        provider: siliconflow
        model: deepseek-ai/DeepSeek-V3.2
        supports-thinking: true
        priority: 2
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
        priority: 2

  embedding:
    # 单个远程嵌入调用的总预算；超时后由模型路由按候选顺序降级。
    timeout-millis: 10000
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 2

  rerank:
    default-model: qwen3-reranker-8b
    candidates:
      - id: qwen3-reranker-8b
        provider: siliconflow
        model: Qwen/Qwen3-Reranker-8B
        priority: 1
      - id: qwen3-rerank-bailian
        provider: bailian
        model: qwen3-rerank
        priority: 10
        enabled: false
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  # Change default-model and enable the matching candidate to switch vision
  # providers. The parser selects the corresponding request/response protocol.
  vision:
    default-model: qwen3-vl-32b
    candidates:
      - id: qwen3-vl-32b
        provider: siliconflow
        model: Qwen/Qwen3-VL-32B-Instruct
        priority: 1
      - id: qwen-vl-max-bailian
        provider: bailian
        model: qwen-vl-max
        priority: 10
        enabled: false

rustfs:
  url: http://localhost:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false

phase5:
  # Phase 5 rebuild is opt-in. Its bounded retry path always uses this exact
  # configured model and never enters online routing fallback.
  startup-embedding:
    model-id: qwen-emb-8b

# --- Phase 4: 多源融合权重配置 ---
ragent:
  hypergraph:
    entity-normalization:
      aliases:
        "风机1号": "1号鼓风机"
        "一号风机": "1号鼓风机"
        "跳机": "过载跳闸"

  fusion:
    enabled: true
    weights:
      VECTOR_GLOBAL: 1.0
      INTENT_DIRECTED: 1.0
      KEYWORD_ES: 0.9
      HYBRID: 1.0
      IMAGE_SEMANTIC: 0.9
      HYPERGRAPH: 1.1

  # --- Phase 6: 静态资源映射（多模态引用图片） ---
  static-resource:
    enabled: true
    # URL 匹配模式：/files/drawings/xxx.jpg
    url-pattern: /files/**
    # 本地文件目录（相对 bootstrap 模块工作目录，部署时可按需改绝对路径）
    location: file:data/images/
