name: ragent-stack

# ============================================================
# Ragent 智研中枢系统 - 一键容器化编排
# 一键启动全部服务：PostgreSQL + Redis + RocketMQ + Milvus + 后端 + 前端
# 刚开机零依赖，docker compose up -d --build 即可整体拉起并演示
# ============================================================
#
# 启动（首次需构建镜像，耗时较长）：docker compose up -d --build
# 停止：docker compose down
# 查看状态：docker compose ps
#
# 访问：前端 http://localhost:5177  （默认账号 admin / admin）
#
# 环境变量（可选）：BAILIAN_API_KEY / SILICONFLOW_API_KEY（LLM 调用）

services:
  # ============================================================
  # PostgreSQL 16 - 业务数据库
  # ============================================================
  postgres:
    container_name: ragent-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragent
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ragent/resources/database/schema_pg.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./ragent/resources/database/init_data_pg.sql:/docker-entrypoint-initdb.d/02_init_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Redis 7 - 缓存 / 分布式限流 / 会话管理
  # ============================================================
  redis:
    container_name: ragent-redis
    image: redis:7-alpine
    command: redis-server --requirepass 123456 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # RocketMQ 5.2 - 消息队列
  # ============================================================
  rocketmq-namesrv:
    container_name: ragent-rmq-namesrv
    image: apache/rocketmq:5.2.0
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Duser.home=/home/rocketmq"
    volumes:
      - rmq-namesrv-data:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rocketmq-broker:
    container_name: ragent-rmq-broker
    image: apache/rocketmq:5.2.0
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Duser.home=/home/rocketmq"
    volumes:
      - rmq-broker-data:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Milvus 2.6 - 向量数据库栈（etcd + RustFS + Milvus + Attu）
  # ============================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  rustfs:
    container_name: milvus-rustfs
    image: rustfs/rustfs:1.0.0-alpha.72
    command:
      - "--address"
      - ":9000"
      - "--console-enable"
      - "--access-key"
      - "rustfsadmin"
      - "--secret-key"
      - "rustfsadmin"
      - "/data"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: rustfsadmin
      MINIO_SECRET_ACCESS_KEY: rustfsadmin
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - rustfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.6.3
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus

  # ============================================================
  # 后端 - Spring Boot 服务（镜像内多阶段构建）
  # 通过容器内服务名连接中间件；LLM API Key 从宿主机环境变量/.env 注入
  # ============================================================
  backend:
    container_name: ragent-backend
    build:
      context: ./ragent
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      # 容器内服务名连接中间件（覆盖 application.yaml 中的 127.0.0.1）
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragent?client_encoding=UTF8
      SPRING_DATA_REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      MILVUS_URI: http://milvus:19530
      RUSTFS_URL: http://rustfs:9000
      # 首次启动自动将演示数据（FAQ 210 条 / 图纸 12 张 / 超边 633 条）入库（幂等：先清空再全量写入）
      PHASE5_INGEST: "true"
      # LLM API Key（可空，缺省时仅登录/管理功能可用）
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
    ports:
      - "9090:9090"
    volumes:
      # 演示数据与运行时数据直接挂载宿主机 ragent/bootstrap/data
      # （图纸/FAQ/超边天然可见，头像上传等运行时数据持久化到宿主机）
      - ./ragent/bootstrap/data:/app/data
      # OCR 语言包（宿主机已下载，避免容器内从 GitHub 下载被墙）
      - ./ragent/bootstrap/tessdata:/app/tessdata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/api/ragent/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  # ============================================================
  # 前端 - Nginx 静态服务 + /api 反向代理（接管 5177 端口）
  # ============================================================
  frontend:
    container_name: ragent-frontend
    build:
      context: ./ragent/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/ragent
    ports:
      - "5177:5177"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rmq-namesrv-data:
  rmq-broker-data:
  etcd-data:
  rustfs-data:
  milvus-data:

networks:
  default:
    name: ragent-net
